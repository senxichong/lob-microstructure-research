[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lob-microstructure-research"
version = "0.1.0"
description = "Reproducible Phase-1 ITCH 2.0 integrity research"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "PyYAML>=6,<7", "pyarrow>=18,<27", "numpy>=2,<3", "psutil>=6,<8", "tzdata>=2024"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
lob-phase1 = "lob_research.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
